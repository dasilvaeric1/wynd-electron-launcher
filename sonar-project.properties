sonar.projectKey=electron-launcher
sonar.projectName=Wynd Electron Launcher

sonar.sources=src
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

# Sorties de build et code vendore : analyser un bundle minifie noie le signal
# reel sous des milliers de faux positifs.
sonar.exclusions=\
  src/*/dist/**,\
  local/**,\
  assets/rrweb/**,\
  **/node_modules/**,\
  dist/**,\
  dll/**,\
  release/**,\
  coverage/**

# Couverture : jest est configure en reporter `json`, que Sonar ne lit pas —
# d'ou les 0 % affiches jusqu'ici alors que la suite couvre ~26 %. Produire le
# lcov AVANT le scan :
#   npx jest --coverage --coverageReporters=lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
