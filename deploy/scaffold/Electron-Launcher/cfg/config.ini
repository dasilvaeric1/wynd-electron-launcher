[log]
main=info
renderer=info
app=info
; Persistance fichier locale des logs JS du SCO/POS dans logs/app/
; (remplace le logserver HTTP NW.js). Absent/0 = desactive.
;persist_app=1
; Capture des erreurs JS non catchees du POS (window.onerror + rejections).
; Fonctionne en view=webview ET view=iframe. Absent/0 = desactive.
;capture_errors=1
; Capture des console.error / console.warn du POS. Absent/0 = desactive.
;capture_console=1
; Capture des requetes reseau en echec du POS (status>=400 ou erreur reseau,
; via CDP avec corps tronques). Absent/0 = desactive.
;capture_network=1

[trace]
; Trace continue de la caisse : rrweb (rejouer l'ecran), reseau (metadonnees)
; et actions Redux (chapitrage du replay). Chunks independamment rejouables,
; uploades au fil de l'eau vers le dashboard.
; Absent/0 = desactive.
enable=0
; Autorise l'activation a distance depuis le dashboard. Absent = autorise ;
; poser 0 verrouille la caisse (le BO ne peut plus l'activer).
allow_remote=1
; Duree d'un chunk en secondes (defaut 300, borne 30-1800). Plus court = plus
; de snapshots complets, donc plus de volume.
chunk_seconds=300
; Plafond disque du spool en Mo (defaut 500, borne 10-5000). Au-dela, les
; chunks les PLUS ANCIENS sont supprimes.
spool_max_mb=500
; Pause de la capture apres N secondes sans interaction (0 = jamais).
; Premier levier de volume sur une caisse peu sollicitee.
idle_pause_seconds=60
; Echantillonnage des mouvements pointeur en ms. Ecrans tactiles : gouverne
; aussi les touchmove.
mousemove_ms=150
; --- Masquage : NON modifiable a distance --------------------------------
; Masque la valeur de tous les champs de saisie.
mask_all_inputs=1
; Les elements portant cette classe ont leur texte masque dans le replay.
mask_text_class=el-mask
; Les elements portant cette classe sont totalement exclus du replay.
block_class=el-norec
; Metadonnees reseau dans la trace (jamais les corps).
capture_net=1
; Actions Redux dans la trace (chapitrage du replay).
capture_redux=1

