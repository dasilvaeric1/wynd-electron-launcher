# CI launcher Wynd.
#
# Pipeline :
#   dist          → bundle renderer (webpack prod) sur node:16 (chemin prouvé)
#   build:linux   → AppImage Linux (existant, sur tag)
#   build:win     → .exe portable Windows x64 (cross-compile via wine)
#
# Le renderer est buildé UNE fois sur node:16 puis partagé en artefact aux
# jobs de packaging : evite de relancer webpack (et son besoin
# d'--openssl-legacy-provider) sur l'image wine au node plus recent.

stages:
  - dist
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG # releases
    - if: $CI_PIPELINE_SOURCE == "web" # run manuel depuis l'UI GitLab
    - if: $CI_COMMIT_BRANCH == "develop" # CI sur la branche de travail

# ---------------------------------------------------------------------------
# Bundle renderer (container + loader) — webpack prod. node:16 = pas besoin
# d'--openssl-legacy-provider, et le hook `prepare` (DLL dev) y passe deja.
# ---------------------------------------------------------------------------
dist:
  stage: dist
  image: node:22
  tags:
    - docker
  variables:
    # webpack 5.36 sur node ≥17 → erreur OpenSSL "digital envelope routines"
    # sans ce flag (le pin node:16 historique servait à l'éviter). node:20
    # requis car des deps transitives exigent désormais node ≥18 (color@5…).
    NODE_OPTIONS: "--openssl-legacy-provider"
  cache:
    key: node20-modules
    paths:
      - node_modules/
  script:
    - yarn
    - yarn dist
  artifacts:
    expire_in: 1 day
    paths:
      - src/container/dist/*
      - src/loader/dist/*

# ---------------------------------------------------------------------------
# AppImage Linux (comportement existant — uniquement sur tag).
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: node:22
  tags:
    - docker
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
  needs:
    - dist
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - yarn
    - yarn build:linux
  artifacts:
    paths:
      - dist/*.yml
      - dist/*.AppImage

# ---------------------------------------------------------------------------
# Windows x64 portable (.exe) — cross-compile via l'image electron-builder
# avec wine. Reutilise le bundle renderer du job `dist` (artefacts), donc on
# ne relance PAS webpack ici. --openssl-legacy-provider couvre le hook
# `prepare` (webpack DLL) declenche par `yarn install` sur le node de l'image.
#
# `--win portable --x64` override les targets du package.json pour ne sortir
# QUE le portable x64 (pas nsis, pas ia32) → build plus rapide.
# ---------------------------------------------------------------------------
build:win:
  stage: build
  image: electronuserland/builder:wine
  tags:
    - docker
  needs:
    - dist
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
    # Cache des binaires electron telecharges par electron-builder.
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: wine-electron-cache
    paths:
      - .cache/electron
      - .cache/electron-builder
  script:
    - yarn
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - yarn electron-builder --win portable --x64
    # Artefact de déploiement Nexus : archive Electron-Launcher_<version>.zip
    # (arborescence Electron-Launcher/cfg|launch|portable — format consommé
    # par le canal de déploiement). zip absent de certaines images → install.
    - which zip || (apt-get update -qq && apt-get install -y -qq zip)
    - SKIP_BUILD=1 MODE=archive bash scripts/make_deploy_zip.sh
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*-x64-portable.exe
      - deploy/out/electron_zip/Electron-Launcher_*.zip
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Upload de l'archive sur Nexus — UNIQUEMENT sur tag (release).
# Récupère l'artefact zip de build:win et le pousse sur :
#   https://nexus.wynd.eu/repository/integration/product/electron_zip/<nom>.zip
# Le nom (Electron-Launcher_<version>.zip) est déduit du fichier produit, donc
# il suit toujours la version réellement buildée (package.json).
# Credentials : variables CI/CD NEXUS_USER / NEXUS_PASSWORD (déjà configurées).
# ---------------------------------------------------------------------------
deploy:nexus:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - job: build:win
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'apk add --no-cache curl'
    - 'ZIP=$(ls deploy/out/electron_zip/Electron-Launcher_*.zip 2>/dev/null | head -1)'
    - 'if [ -z "$ZIP" ]; then echo "ERREUR aucune archive a publier"; exit 1; fi'
    - 'NAME=$(basename "$ZIP")'
    - 'TARGET="https://nexus.wynd.eu/repository/integration/product/electron_zip/$NAME"'
    - 'echo "Uploading $NAME vers $TARGET"'
    - 'curl --fail -u "${NEXUS_USER}:${NEXUS_PASSWORD}" --upload-file "$ZIP" "$TARGET"'
    - 'echo "Upload OK -> $TARGET"'
