# CI launcher Wynd.
#
# Pipeline :
#   quality       → eslint + jest (bloquant sur develop/tag, signale ailleurs)
#   dist          → bundle renderer (Vite) sur node:22 / pnpm
#   build:linux   → AppImage + .deb + .rpm (auto sur tag, MANUEL sur branche)
#   build:win     → .exe portable Windows x64 (cross-compile via wine) + zip Nexus
#                   (auto sur tag, MANUEL sur branche)
#   smoke:linux   → installe le .deb produit et LANCE le binaire sous xvfb
#   deploy:nexus  → upload du zip sur Nexus (sur tag uniquement)
#
# Builds a la demande sur une branche : pousser la branche cree un pipeline qui
# ne lance QUE `dist`. Les jobs de packaging apparaissent avec un bouton ▶ ;
# leurs artefacts se telechargent directement depuis GitLab, ce qui permet de
# tester une install manuelle sans passer par Nexus (voir deploy:nexus, reserve
# aux tags : c'est le canal que le control-center consomme).
#
# Le renderer est buildé UNE fois (job dist) puis partagé en artefact aux jobs
# de packaging. pnpm + lockfile committé = builds reproductibles.

stages:
  - quality
  - dist
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG # releases
    - if: $CI_PIPELINE_SOURCE == "web" # run manuel depuis l'UI GitLab
    # Toute branche : sans cette regle, AUCUN pipeline n'etait cree hors
    # develop, donc les jobs `when: manual` de packaging restaient
    # inatteignables. Seul `dist` demarre automatiquement ; le packaging reste
    # sur bouton.
    #
    # Pas de regle `merge_request_event` : elle ferait coexister un pipeline de
    # branche ET un pipeline de MR a chaque push (doublon), et les jobs de
    # packaging s'appuient sur $CI_COMMIT_BRANCH, qui n'est pas defini dans un
    # pipeline de MR — ils n'y apparaitraient donc pas.
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Lint + tests unitaires.
#
# Bloquant sur `develop` et sur les tags : rien ne se construit si la qualite
# regresse. Sur une branche de travail, le job signale sans bloquer — on doit
# pouvoir produire un .exe ou un .deb a tester meme avec un lint en cours de
# correction.
#
# Le setup jest (build/jest_global_setup.js) provisionne lui-meme le front
# embarque factice de src/local/, gitignore : rien a preparer ici.
# ---------------------------------------------------------------------------
quality:
  stage: quality
  image: node:24
  interruptible: true
  tags:
    - docker
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm test
  rules:
    - if: $CI_COMMIT_TAG # release : gate dur
    - if: $CI_COMMIT_BRANCH == "develop" # branche de travail : gate dur
    - if: $CI_COMMIT_BRANCH # autre branche : signale, ne bloque pas
      allow_failure: true

# ---------------------------------------------------------------------------
# Bundle renderer (container + loader) — Vite (remplace webpack).
# ---------------------------------------------------------------------------
dist:
  stage: dist
  image: node:24
  # Un nouveau push sur la meme branche annule le pipeline precedent.
  interruptible: true
  tags:
    - docker
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm dist
  artifacts:
    expire_in: 1 day
    paths:
      - src/container/dist/*
      - src/loader/dist/*

# ---------------------------------------------------------------------------
# Paquets Linux x64 : AppImage + .deb (Debian/Ubuntu) + .rpm (RHEL/Rocky).
#
# Les trois cibles sont declarees dans package.json (build.linux.target), avec
# maintainer/vendor/homepage : plus besoin des overrides -c.extraMetadata.* en
# ligne de commande.
#
# `rpmbuild` n'est pas dans l'image node:22 — fpm en a besoin pour la cible rpm.
# AppImage exige FUSE 2 a l'EXECUTION (absent par defaut sur Debian 13 et sur
# une Rocky minimale) : `apt install libfuse2t64` / `dnf install fuse-libs`, ou
# lancer avec --appimage-extract-and-run. Le .deb et le .rpm evitent ce piege.
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: node:24
  interruptible: true
  tags:
    - docker
  needs:
    - dist
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true
  before_script:
    - corepack enable
    - apt-get update -qq && apt-get install -y -qq rpm fakeroot
  script:
    - pnpm install --frozen-lockfile
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - pnpm electron-builder --linux AppImage deb rpm --x64 --publish never
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*.yml
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm

# ---------------------------------------------------------------------------
# Windows x64 portable (.exe) — cross-compile via l'image electron-builder/wine.
# Réutilise le bundle renderer du job dist (artefacts) → ne rebuild PAS le
# renderer ici. `--win portable --x64` ne sort QUE le portable x64.
# ---------------------------------------------------------------------------
build:win:
  stage: build
  image: electronuserland/builder:wine
  interruptible: true
  tags:
    - docker
  needs:
    - dist
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
    # 7za etait tue par un signal (exit code null) pendant la compression du
    # payload NSIS. Mesure sur une charge comparable (294 Mo) :
    #
    #   niveau   duree   memoire de pointe   archive
    #   -mx=1     2,0 s          43 Mo        101 Mo
    #   -mx=2     2,1 s          54 Mo         97 Mo
    #   -mx=3     3,7 s         137 Mo         93 Mo   <- retenu
    #   -mx=4     7,6 s         478 Mo         91 Mo
    #   -mx=5      27 s         971 Mo         80 Mo
    #   -mx=9      72 s         966 Mo         74 Mo   <- defaut, tue par le noyau
    #
    # -mx=9 est le defaut d'electron-builder pour le format 7z quel que soit
    # `compression` (seul "store" donne -mx=0). Un pic a ~1 Go pour une etape
    # de compression, sur un runner conteneurise, c'est le profil d'un OOM.
    #
    # -mx=3 tient en 137 Mo — sept fois moins que ce qui a tue le job — pour
    # 8 % de moins que -mx=1. Au-dela, la memoire explose sans gain
    # proportionnel : -mx=4 triple l'empreinte pour 2 % de plus.
    #
    # LE VRAI LEVIER EST AILLEURS : avec 2 Go sur le runner, supprimer cette
    # variable rend -mx=9, soit ~27 % de moins qu'ici ET une extraction plus
    # rapide sur les caisses. Tout le reste n'est que grappillage.
    ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"
  cache:
    key: wine-electron-cache
    paths:
      - .cache/electron
      - .cache/electron-builder
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - pnpm electron-builder --win portable --x64 --publish never
    # Artefact de déploiement Nexus : archive Electron-Launcher_<version>.zip
    # (arborescence Electron-Launcher/cfg|launch|portable). zip parfois absent → install.
    - which zip || (apt-get update -qq && apt-get install -y -qq zip)
    - SKIP_BUILD=1 MODE=archive bash scripts/make_deploy_zip.sh
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*-x64-portable.exe
      - deploy/out/electron_zip/Electron-Launcher_*.zip
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Fumigation du paquet : installe le .deb produit par build:linux et LANCE
# vraiment le binaire.
#
# Raison d'etre (cf l'en-tete de scripts/smoke_packaged.sh) : electron-builder
# omet silencieusement des dependances transitives de cet arbre pnpm. Le
# symptome n'apparait QU'AU LANCEMENT du binaire packagé — ni `pnpm test`, ni
# `pnpm dist`, ni le build lui-meme ne le voient. Trois plantages en production
# ont ete decouverts ainsi (string-width, strip-ansi, fs.realpath).
#
# Passer par `apt-get install ./dist/*.deb` teste EN PLUS la liste de
# dependances du paquet : apt refuse d'installer si elle est incomplete, et
# tire les bibliotheques Electron a la place d'une liste ecrite a la main ici.
# ---------------------------------------------------------------------------
smoke:linux:
  stage: build
  image: node:24
  interruptible: true
  tags:
    - docker
  needs:
    - job: build:linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG # avant toute release
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq
    # xvfb-run appelle xauth pour fabriquer son cookie : sans lui il sort
    # « xvfb-run: error: xauth command not found ». Le paquet xvfb ne le tire pas.
    - apt-get install -y -qq --no-install-recommends xvfb xauth
  script:
    - apt-get install -y -qq ./dist/*.deb
    - export SMOKE_BIN=/opt/electron-launcher/wynd-electron-launcher
    - xvfb-run -a bash scripts/smoke_packaged.sh

# ---------------------------------------------------------------------------
# Upload de l'archive sur Nexus — UNIQUEMENT sur tag (release).
# Récupère l'artefact zip de build:win et le pousse sur :
#   https://nexus.wynd.eu/repository/integration/product/electron_zip/<nom>.zip
# Le nom (Electron-Launcher_<version>.zip) est déduit du fichier produit, donc
# il suit toujours la version réellement buildée (package.json).
# Credentials : variables CI/CD NEXUS_USER / NEXUS_PASSWORD (déjà configurées).
# ---------------------------------------------------------------------------
deploy:nexus:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - job: build:win
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'apk add --no-cache curl'
    - 'ZIP=$(ls deploy/out/electron_zip/Electron-Launcher_*.zip 2>/dev/null | head -1)'
    - 'if [ -z "$ZIP" ]; then echo "ERREUR aucune archive a publier"; exit 1; fi'
    - 'NAME=$(basename "$ZIP")'
    - 'TARGET="https://nexus.wynd.eu/repository/integration/product/electron_zip/$NAME"'
    - 'echo "Uploading $NAME vers $TARGET"'
    - 'curl --fail -u "${NEXUS_USER}:${NEXUS_PASSWORD}" --upload-file "$ZIP" "$TARGET"'
    - 'echo "Upload OK -> $TARGET"'
