# CI launcher Wynd.
#
# Pipeline :
#   dist          → bundle renderer (Vite) sur node:22 / pnpm
#   build:linux   → AppImage Linux (sur tag)
#   build:win     → .exe portable Windows x64 (cross-compile via wine) + zip Nexus
#   deploy:nexus  → upload du zip sur Nexus (sur tag uniquement)
#
# Le renderer est buildé UNE fois (job dist) puis partagé en artefact aux jobs
# de packaging. pnpm + lockfile committé = builds reproductibles.

stages:
  - dist
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG # releases
    - if: $CI_PIPELINE_SOURCE == "web" # run manuel depuis l'UI GitLab
    - if: $CI_COMMIT_BRANCH == "develop" # CI sur la branche de travail
    - if: $CI_COMMIT_BRANCH == "chore/modernize-vite-pnpm" # branche de migration

# ---------------------------------------------------------------------------
# Bundle renderer (container + loader) — Vite (remplace webpack).
# ---------------------------------------------------------------------------
dist:
  stage: dist
  image: node:22
  tags:
    - docker
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm dist
  artifacts:
    expire_in: 1 day
    paths:
      - src/container/dist/*
      - src/loader/dist/*

# ---------------------------------------------------------------------------
# AppImage Linux (uniquement sur tag).
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: node:22
  tags:
    - docker
  needs:
    - dist
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:linux
  artifacts:
    paths:
      - dist/*.yml
      - dist/*.AppImage

# ---------------------------------------------------------------------------
# Windows x64 portable (.exe) — cross-compile via l'image electron-builder/wine.
# Réutilise le bundle renderer du job dist (artefacts) → ne rebuild PAS le
# renderer ici. `--win portable --x64` ne sort QUE le portable x64.
# ---------------------------------------------------------------------------
build:win:
  stage: build
  image: electronuserland/builder:wine
  tags:
    - docker
  needs:
    - dist
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: wine-electron-cache
    paths:
      - .cache/electron
      - .cache/electron-builder
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - pnpm electron-builder --win portable --x64
    # Artefact de déploiement Nexus : archive Electron-Launcher_<version>.zip
    # (arborescence Electron-Launcher/cfg|launch|portable). zip parfois absent → install.
    - which zip || (apt-get update -qq && apt-get install -y -qq zip)
    - SKIP_BUILD=1 MODE=archive bash scripts/make_deploy_zip.sh
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*-x64-portable.exe
      - deploy/out/electron_zip/Electron-Launcher_*.zip
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Upload de l'archive sur Nexus — UNIQUEMENT sur tag (release).
# Récupère l'artefact zip de build:win et le pousse sur :
#   https://nexus.wynd.eu/repository/integration/product/electron_zip/<nom>.zip
# Le nom (Electron-Launcher_<version>.zip) est déduit du fichier produit, donc
# il suit toujours la version réellement buildée (package.json).
# Credentials : variables CI/CD NEXUS_USER / NEXUS_PASSWORD (déjà configurées).
# ---------------------------------------------------------------------------
deploy:nexus:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - job: build:win
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'apk add --no-cache curl'
    - 'ZIP=$(ls deploy/out/electron_zip/Electron-Launcher_*.zip 2>/dev/null | head -1)'
    - 'if [ -z "$ZIP" ]; then echo "ERREUR aucune archive a publier"; exit 1; fi'
    - 'NAME=$(basename "$ZIP")'
    - 'TARGET="https://nexus.wynd.eu/repository/integration/product/electron_zip/$NAME"'
    - 'echo "Uploading $NAME vers $TARGET"'
    - 'curl --fail -u "${NEXUS_USER}:${NEXUS_PASSWORD}" --upload-file "$ZIP" "$TARGET"'
    - 'echo "Upload OK -> $TARGET"'
