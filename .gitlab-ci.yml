# CI launcher Wynd.
#
# Pipeline :
#   dist          → bundle renderer (webpack prod) sur node:16 (chemin prouvé)
#   build:linux   → AppImage Linux (existant, sur tag)
#   build:win     → .exe portable Windows x64 (cross-compile via wine)
#
# Le renderer est buildé UNE fois sur node:16 puis partagé en artefact aux
# jobs de packaging : evite de relancer webpack (et son besoin
# d'--openssl-legacy-provider) sur l'image wine au node plus recent.

stages:
  - dist
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG # releases
    - if: $CI_PIPELINE_SOURCE == "web" # run manuel depuis l'UI GitLab
    - if: $CI_COMMIT_BRANCH == "develop" # CI sur la branche de travail

# ---------------------------------------------------------------------------
# Bundle renderer (container + loader) — webpack prod. node:16 = pas besoin
# d'--openssl-legacy-provider, et le hook `prepare` (DLL dev) y passe deja.
# ---------------------------------------------------------------------------
dist:
  stage: dist
  image: node:16
  cache:
    key: node16-modules
    paths:
      - node_modules/
  script:
    - yarn
    - yarn dist
  artifacts:
    expire_in: 1 day
    paths:
      - src/container/dist/*
      - src/loader/dist/*

# ---------------------------------------------------------------------------
# AppImage Linux (comportement existant — uniquement sur tag).
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: node:16
  needs:
    - dist
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - yarn
    - yarn build:linux
  artifacts:
    paths:
      - dist/*.yml
      - dist/*.AppImage

# ---------------------------------------------------------------------------
# Windows x64 portable (.exe) — cross-compile via l'image electron-builder
# avec wine. Reutilise le bundle renderer du job `dist` (artefacts), donc on
# ne relance PAS webpack ici. --openssl-legacy-provider couvre le hook
# `prepare` (webpack DLL) declenche par `yarn install` sur le node de l'image.
#
# `--win portable --x64` override les targets du package.json pour ne sortir
# QUE le portable x64 (pas nsis, pas ia32) → build plus rapide.
# ---------------------------------------------------------------------------
build:win:
  stage: build
  image: electronuserland/builder:wine
  needs:
    - dist
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
    # Cache des binaires electron telecharges par electron-builder.
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: wine-electron-cache
    paths:
      - .cache/electron
      - .cache/electron-builder
  script:
    - yarn
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - yarn electron-builder --win portable --x64
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*-x64-portable.exe
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true
