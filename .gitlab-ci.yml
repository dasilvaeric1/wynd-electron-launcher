# CI launcher Wynd.
#
# Pipeline :
#   quality       → eslint + jest (bloquant sur develop/tag, signale ailleurs)
#   sonar            → SonarQube sur la couverture reelle (si SONAR_TOKEN existe)
#   security:deps    → pnpm audit : bloquant sur tag, informatif ailleurs
#   security:secrets → gitleaks sur l'arborescence : bloquant PARTOUT
#   security:electron → electronegativity : informatif (allow_failure)
#   dist          → bundle renderer (Vite) sur node:22 / pnpm
#   build:linux   → AppImage + .deb + .rpm (auto sur tag, MANUEL sur branche)
#   build:win     → .exe portable Windows x64 (cross-compile via wine) + zip Nexus
#                   (auto sur tag, MANUEL sur branche)
#   smoke:linux   → installe le .deb produit et LANCE le binaire sous xvfb
#   deploy:nexus  → upload du zip sur Nexus (sur tag uniquement)
#   deploy:nexus:linux → upload .rpm/.deb + SHA256SUMS sur Nexus (sur tag uniquement),
#                        consommés par le provisionnement des caisses Rocky
#
# Builds a la demande sur une branche : pousser la branche cree un pipeline qui
# ne lance QUE `dist`. Les jobs de packaging apparaissent avec un bouton ▶ ;
# leurs artefacts se telechargent directement depuis GitLab, ce qui permet de
# tester une install manuelle sans passer par Nexus (voir deploy:nexus, reserve
# aux tags : c'est le canal que le control-center consomme).
#
# Le renderer est buildé UNE fois (job dist) puis partagé en artefact aux jobs
# de packaging. pnpm + lockfile committé = builds reproductibles.

stages:
  - quality
  - dist
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG # releases
    - if: $CI_PIPELINE_SOURCE == "web" # run manuel depuis l'UI GitLab
    # Toute branche : sans cette regle, AUCUN pipeline n'etait cree hors
    # develop, donc les jobs `when: manual` de packaging restaient
    # inatteignables. Seul `dist` demarre automatiquement ; le packaging reste
    # sur bouton.
    #
    # Pas de regle `merge_request_event` : elle ferait coexister un pipeline de
    # branche ET un pipeline de MR a chaque push (doublon), et les jobs de
    # packaging s'appuient sur $CI_COMMIT_BRANCH, qui n'est pas defini dans un
    # pipeline de MR — ils n'y apparaitraient donc pas.
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Lint + tests unitaires.
#
# Bloquant sur `develop` et sur les tags : rien ne se construit si la qualite
# regresse. Sur une branche de travail, le job signale sans bloquer — on doit
# pouvoir produire un .exe ou un .deb a tester meme avec un lint en cours de
# correction.
#
# Le setup jest (build/jest_global_setup.js) provisionne lui-meme le front
# embarque factice de src/local/, gitignore : rien a preparer ici.
# ---------------------------------------------------------------------------
quality:
  stage: quality
  image: node:24
  interruptible: true
  tags:
    - docker
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    # `test:coverage` et pas `test` : sonar-project.properties pointe sur
    # coverage/lcov.info, que jest ne produisait pas (coverageReporters etait
    # limite a "json"). Le scan tournait donc sur une couverture vide.
    - pnpm test:coverage
    # bash est present dans l'image node:24 (Debian) — pas d'installation.
    - bash scripts/publish_linux_nexus.test.sh
  # Chiffre repris du resume jest, affiche par GitLab sur le job et la MR.
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - coverage/
  rules:
    - if: $CI_COMMIT_TAG # release : gate dur
    - if: $CI_COMMIT_BRANCH == "develop" # branche de travail : gate dur
    - if: $CI_COMMIT_BRANCH # autre branche : signale, ne bloque pas
      allow_failure: true

# ---------------------------------------------------------------------------
# Analyse SonarQube — qualite + securite, sur la couverture reelle.
#
# Le scan consomme l'artefact `coverage/` du job quality : sans lui, sonar
# rapporte 0 % et la note de couverture est un mensonge.
#
# GIT_DEPTH: 0 est NECESSAIRE — sonar date chaque ligne via git blame pour
# distinguer le "code nouveau" de l'existant. Sur un clone superficiel (20
# commits par defaut chez GitLab), tout le fichier parait nouveau et la
# quality gate se declenche sur du code qui n'a pas bouge.
#
# Le job ne s'execute que si SONAR_TOKEN est defini, sinon il disparait du
# pipeline au lieu d'echouer bruyamment sur chaque projet forke.
# ---------------------------------------------------------------------------
sonar:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  interruptible: true
  tags:
    - docker
  needs:
    - job: quality
      artifacts: true
  variables:
    GIT_DEPTH: 0
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}" -Dsonar.projectVersion="$(node -p "require('./package.json').version")"
  rules:
    - if: $SONAR_TOKEN == null
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Securite — dependances vulnerables.
#
# Bloquant sur TAG uniquement, et c'est deliberе : une CVE publiee en amont
# apparait sans qu'on ait touche au code. Bloquer `develop` ferait echouer le
# pipeline un matin ou personne n'a rien change, ce qui apprend a l'equipe a
# ignorer le job. Sur un tag, en revanche, on refuse de livrer une version
# vulnerable connue.
#
# `--prod` d'abord : ce sont les dependances qui partent REELLEMENT dans
# l'asar. L'audit complet (devDependencies incluses) suit en informatif — la
# chaine de build merite un oeil, sans porter le veto de release.
# ---------------------------------------------------------------------------
security:deps:
  stage: quality
  image: node:24
  interruptible: true
  tags:
    - docker
  before_script:
    - corepack enable
  script:
    - echo "--- dependances embarquees (bloquant sur tag) ---"
    - pnpm audit --prod --audit-level=high
    - echo "--- chaine de build (informatif) ---"
    - pnpm audit --audit-level=high || echo "Vulnerabilites en devDependencies - a traiter, non bloquant"
  rules:
    - if: $CI_COMMIT_TAG # refus de livrer une version vulnerable connue
    - if: $CI_COMMIT_BRANCH
      allow_failure: true

# ---------------------------------------------------------------------------
# Securite — secrets committes.
#
# Bloquant PARTOUT, sans exception. Contrairement aux CVE, un secret
# n'apparait jamais tout seul : il arrive par un commit, donc il n'y a pas de
# bruit de fond a tolerer. Et une cle poussee est une cle a revoquer, meme
# retiree ensuite — mieux vaut refuser le job.
#
# `--no-git` scanne l'arborescence telle qu'elle sera livree, pas l'historique.
# Scanner l'historique bloquerait indefiniment le pipeline sur un secret deja
# revoque il y a deux ans : c'est un chantier de remediation, pas une gate de
# CI.
#
# .gitleaks.toml n'ecarte que les sorties de build (bundles Vite minifies, ou
# `e.columnsKey,<hash>` se lit comme une cle d'API). Sans ce fichier le job
# passerait quand meme ici — les bundles ne sont pas encore construits a ce
# stade — mais par accident : le resultat dependrait de l'ordre des jobs, et
# un developpeur qui lance la commande apres un `pnpm dist` verrait 7 fausses
# alertes. Aucune regle n'est affaiblie.
# ---------------------------------------------------------------------------
security:secrets:
  stage: quality
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  interruptible: true
  tags:
    - docker
  script:
    - gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 1

# ---------------------------------------------------------------------------
# Securite — anti-patterns specifiques a Electron (electronegativity).
#
# INFORMATIF : allow_failure partout. L'outil ne sort pas en erreur quand il
# trouve quelque chose, donc allow_failure ne couvre que sa propre defaillance
# (reseau, npx). Le rapport est publie en artefact et resume dans le log.
#
# `-e` est INDISPENSABLE. Sans lui, electronegativity ne trouve pas de
# package.json sous `src/`, suppose Electron v0.1.0 et evalue les defauts de
# cette epoque : il a par exemple signale en HIGH un `nodeIntegration` sur une
# fenetre qui pose explicitement `sandbox: true` — nodeIntegration vaut false
# par defaut depuis Electron 5. Avec la vraie version, 23 constats tombent a
# 16, dont plus aucun HIGH. Une gate qui ment est une gate qu'on ignore.
# ---------------------------------------------------------------------------
security:electron:
  stage: quality
  image: node:24
  interruptible: true
  tags:
    - docker
  allow_failure: true
  script:
    - ELECTRON_VERSION=$(node -p "(require('./package.json').devDependencies.electron || '').replace(/[^0-9.]/g, '')")
    - echo "Electron detecte - $ELECTRON_VERSION"
    - npx --yes @doyensec/electronegativity -i src -e "$ELECTRON_VERSION" -r -o electronegativity.csv
    - tail -n +2 electronegativity.csv | cut -d, -f1,2 | sort | uniq -c | sort -rn
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - electronegativity.csv
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH
      when: manual

# ---------------------------------------------------------------------------
# Bundle renderer (container + loader) — Vite (remplace webpack).
# ---------------------------------------------------------------------------
dist:
  stage: dist
  image: node:24
  # Un nouveau push sur la meme branche annule le pipeline precedent.
  interruptible: true
  tags:
    - docker
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm dist
  artifacts:
    expire_in: 1 day
    paths:
      - src/container/dist/*
      - src/loader/dist/*

# ---------------------------------------------------------------------------
# Paquets Linux x64 : AppImage + .deb (Debian/Ubuntu) + .rpm (RHEL/Rocky).
#
# Les trois cibles sont declarees dans package.json (build.linux.target), avec
# maintainer/vendor/homepage : plus besoin des overrides -c.extraMetadata.* en
# ligne de commande.
#
# `rpmbuild` n'est pas dans l'image node:22 — fpm en a besoin pour la cible rpm.
# AppImage exige FUSE 2 a l'EXECUTION (absent par defaut sur Debian 13 et sur
# une Rocky minimale) : `apt install libfuse2t64` / `dnf install fuse-libs`, ou
# lancer avec --appimage-extract-and-run. Le .deb et le .rpm evitent ce piege.
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: node:24
  interruptible: true
  tags:
    - docker
  needs:
    - dist
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true
  before_script:
    - corepack enable
    - apt-get update -qq && apt-get install -y -qq rpm fakeroot
  script:
    - pnpm install --frozen-lockfile
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - pnpm electron-builder --linux AppImage deb rpm --x64 --publish never
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*.yml
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm

# ---------------------------------------------------------------------------
# Windows x64 portable (.exe) — cross-compile via l'image electron-builder/wine.
# Réutilise le bundle renderer du job dist (artefacts) → ne rebuild PAS le
# renderer ici. `--win portable --x64` ne sort QUE le portable x64.
# ---------------------------------------------------------------------------
build:win:
  stage: build
  image: electronuserland/builder:wine
  interruptible: true
  tags:
    - docker
  needs:
    - dist
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
    # 7za etait tue par un signal (exit code null) pendant la compression du
    # payload NSIS. Mesure sur une charge comparable (294 Mo) :
    #
    #   niveau   duree   memoire de pointe   archive
    #   -mx=1     2,0 s          43 Mo        101 Mo
    #   -mx=2     2,1 s          54 Mo         97 Mo
    #   -mx=3     3,7 s         137 Mo         93 Mo   <- retenu
    #   -mx=4     7,6 s         478 Mo         91 Mo
    #   -mx=5      27 s         971 Mo         80 Mo
    #   -mx=9      72 s         966 Mo         74 Mo   <- defaut, tue par le noyau
    #
    # -mx=9 est le defaut d'electron-builder pour le format 7z quel que soit
    # `compression` (seul "store" donne -mx=0). Un pic a ~1 Go pour une etape
    # de compression, sur un runner conteneurise, c'est le profil d'un OOM.
    #
    # -mx=3 tient en 137 Mo — sept fois moins que ce qui a tue le job — pour
    # 8 % de moins que -mx=1. Au-dela, la memoire explose sans gain
    # proportionnel : -mx=4 triple l'empreinte pour 2 % de plus.
    #
    # LE VRAI LEVIER EST AILLEURS : avec 2 Go sur le runner, supprimer cette
    # variable rend -mx=9, soit ~27 % de moins qu'ici ET une extraction plus
    # rapide sur les caisses. Tout le reste n'est que grappillage.
    ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"
  cache:
    key: wine-electron-cache
    paths:
      - .cache/electron
      - .cache/electron-builder
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - node scripts/stamp_build.js # identifiant de build unique (version+date+sha)
    - pnpm electron-builder --win portable --x64 --publish never
    # Artefact de déploiement Nexus : archive Electron-Launcher_<version>.zip
    # (arborescence Electron-Launcher/cfg|launch|portable). zip parfois absent → install.
    - which zip || (apt-get update -qq && apt-get install -y -qq zip)
    - SKIP_BUILD=1 MODE=archive bash scripts/make_deploy_zip.sh
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*-x64-portable.exe
      - deploy/out/electron_zip/Electron-Launcher_*.zip
  rules:
    - if: $CI_COMMIT_TAG # auto sur release
    - if: $CI_COMMIT_BRANCH # manuel sur n'importe quelle branche
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Fumigation du paquet : installe le .deb produit par build:linux et LANCE
# vraiment le binaire.
#
# Raison d'etre (cf l'en-tete de scripts/smoke_packaged.sh) : electron-builder
# omet silencieusement des dependances transitives de cet arbre pnpm. Le
# symptome n'apparait QU'AU LANCEMENT du binaire packagé — ni `pnpm test`, ni
# `pnpm dist`, ni le build lui-meme ne le voient. Trois plantages en production
# ont ete decouverts ainsi (string-width, strip-ansi, fs.realpath).
#
# Passer par `apt-get install ./dist/*.deb` teste EN PLUS la liste de
# dependances du paquet : apt refuse d'installer si elle est incomplete, et
# tire les bibliotheques Electron a la place d'une liste ecrite a la main ici.
# ---------------------------------------------------------------------------
smoke:linux:
  stage: build
  image: node:24
  interruptible: true
  tags:
    - docker
  needs:
    - job: build:linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG # avant toute release
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq
    # xvfb-run appelle xauth pour fabriquer son cookie : sans lui il sort
    # « xvfb-run: error: xauth command not found ». Le paquet xvfb ne le tire pas.
    - apt-get install -y -qq --no-install-recommends xvfb xauth
  script:
    - apt-get install -y -qq ./dist/*.deb
    - export SMOKE_BIN=/opt/electron-launcher/wynd-electron-launcher
    - xvfb-run -a bash scripts/smoke_packaged.sh

# ---------------------------------------------------------------------------
# Upload de l'archive sur Nexus — UNIQUEMENT sur tag (release).
# Récupère l'artefact zip de build:win et le pousse sur :
#   https://nexus.wynd.eu/repository/integration/product/electron_zip/<nom>.zip
# Le nom (Electron-Launcher_<version>.zip) est déduit du fichier produit, donc
# il suit toujours la version réellement buildée (package.json).
# Credentials : variables CI/CD NEXUS_USER / NEXUS_PASSWORD (déjà configurées).
# ---------------------------------------------------------------------------
deploy:nexus:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - job: build:win
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'apk add --no-cache curl'
    - 'ZIP=$(ls deploy/out/electron_zip/Electron-Launcher_*.zip 2>/dev/null | head -1)'
    - 'if [ -z "$ZIP" ]; then echo "ERREUR aucune archive a publier"; exit 1; fi'
    - 'NAME=$(basename "$ZIP")'
    - 'TARGET="https://nexus.wynd.eu/repository/integration/product/electron_zip/$NAME"'
    - 'echo "Uploading $NAME ($(du -h "$ZIP" | cut -f1)) vers $TARGET"'
    # --fail-with-body : sans lui, --fail jette le corps de la reponse, et un
    #   echec Nexus n'affiche que « error: 500 » sans la moindre cause.
    # --retry 3 --retry-all-errors : un 5xx transitoire (blob store occupe,
    #   redemarrage) ne doit pas couler une release. curl renvoie tout le
    #   fichier a chaque tentative, ce qui est acceptable sur le LAN.
    - 'curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 -u "${NEXUS_USER}:${NEXUS_PASSWORD}" --upload-file "$ZIP" "$TARGET"'
    - 'echo "Upload OK -> $TARGET"'

# ---------------------------------------------------------------------------
# Paquets Linux sur Nexus — UNIQUEMENT sur tag de release (vMAJOR.MINOR.PATCH).
#   https://nexus.wynd.eu/repository/integration/product/electron_linux/<version>/
# Le dashboard y lit SHA256SUMS, copie le .rpm dans son cache R2 et le sert
# aux caisses Rocky (provision.sh launcher). <version> = celle du nom du .rpm,
# égale à ELECTRONLAUNCHER_VERSION du .env Nexus.
#
# needs smoke:linux (sans artefact) : n'upload jamais un .deb qui ne se lance
# pas — smoke:linux tourne déjà automatiquement sur tag (voir ses `rules`).
# EXPECTED_VERSION="${CI_COMMIT_TAG#v}" (le tag a un `v` en tête, pas le
# .rpm) : passé en `script:`, pas en `variables:`, qui ne fait pas
# d'expansion shell sur son contenu.
# La logique vit dans scripts/publish_linux_nexus.sh, testé hors CI.
# ---------------------------------------------------------------------------
deploy:nexus:linux:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - job: build:linux
      artifacts: true
    - job: smoke:linux
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - 'apk add --no-cache bash curl coreutils'
    - 'EXPECTED_VERSION="${CI_COMMIT_TAG#v}" bash scripts/publish_linux_nexus.sh dist'
